name: terraform
on:
  pull_request:
    branches: [main]

concurrency:
  group: terraform-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/terraform-check.yaml@main
    with:
      workspaces: '["zero-trust/tunnel"]'
      terraform-version: 1.16.5
