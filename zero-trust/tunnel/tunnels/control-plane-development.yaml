    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE, tloi-dalat/QAE]
  oj.tloi.shop:
    emails: 
      - minhquandinhcao@gmail.com
      - lagiahuy.dl@gmail.com
      - vogiaminhdl@gmail.com
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE, tloi-dalat/QAE]
  oq.tloi.shop:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE, tloi-dalat/QAE]
  sqllab.tloi.shop:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE]
  argocd.tloi.shop:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE]
  mariadb.tloi.shop:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE]
  postgres.tloi.shop:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE]

maintenance:
  tloi.shop:
    enabled: false
  oj.tloi.shop:
    enabled: false

ingress:
  - hostname: tloi.shop
    service: http://site.landing-page.svc.cluster.local:8080

  - hostname: argocd-hook.tloi.shop
    path: ^/api/webhook$
    service: https://argocd-server.argocd.svc.cluster.local:443
    origin_request:
      no_tls_verify: true
  - hostname: argocd.tloi.shop
    service: https://argocd-server.argocd.svc.cluster.local:443
    origin_request:
      no_tls_verify: true

  - hostname: oj.tloi.shop
    path: ^/event/
    service: http://event.online-judge.svc.cluster.local:15100
  - hostname: oj.tloi.shop
    path: ^/channels/
    service: http://event.online-judge.svc.cluster.local:15102
  - hostname: oj.tloi.shop
    path: ^/(martor|pdf|submission_file|static-upload)/
    service: http://media.online-judge.svc.cluster.local:8080
  - hostname: oj.tloi.shop
    service: http://site.online-judge.svc.cluster.local:8000

  - hostname: oq.tloi.shop
    service: http://site.online-quiz.svc.cluster.local:8000

  - hostname: sqllab.tloi.shop
    service: http://sqllab.platform.svc.cluster.local:3000

  - hostname: mariadb.tloi.shop
    service: tcp://mariadb-primary.database.svc.cluster.local:3306

  - hostname: postgres.tloi.shop
    service: tcp://postgres-primary.database.svc.cluster.local:5432
