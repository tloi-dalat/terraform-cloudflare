infisical:
  environment: development
  path: /cloudflared

ingress:
  - hostname: argocd-hook.tloi.shop
    path: ^/api/webhook$
    service: https://argocd-server.argocd.svc.cluster.local:443
    origin_request:
      no_tls_verify: true

  - hostname: oj.tloi.shop
    path: ^/event/
    service: http://online-judge-wsevent.online-judge.svc.cluster.local:15100
  - hostname: oj.tloi.shop
    path: ^/channels/
    service: http://online-judge-wsevent.online-judge.svc.cluster.local:15102
  - hostname: oj.tloi.shop
    path: ^/(martor|pdf|submission_file|static-upload)/
    service: http://online-judge-media.online-judge.svc.cluster.local:8080
  - hostname: oj.tloi.shop
    service: http://online-judge-site.online-judge.svc.cluster.local:8000
