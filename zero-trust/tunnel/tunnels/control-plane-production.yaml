infisical:
  environment: production
  path: /cloudflared

access:
  send.tloi.vn:
    paths: [/admin, /api]
    emails:
      - minhquandinhcao@gmail.com
      - ntson.1303@gmail.com
    github_teams: [tloi-dalat/SRE]
  link-admin.tloi.vn:
    emails:
      - minhquandinhcao@gmail.com
      - ntson.1303@gmail.com
    github_teams: [tloi-dalat/SRE]
  atlantis.tloi.vn:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE]
  sqllab.tloi.vn:
    emails:
      - minhquandinhcao@gmail.com
      - ntson.1303@gmail.com
    github_teams: [tloi-dalat/SRE]
  argocd.tloi.vn:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE]
  monitor.tloi.vn:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE, tloi-dalat/SWE]
  alert.tloi.vn:
    emails: [minhquandinhcao@gmail.com]
    github_teams: [tloi-dalat/SRE]

ingress:
  - hostname: tloi.vn
    service: http://site.landing-page.svc.cluster.local:8080

  - hostname: argocd-hook.tloi.vn
    path: ^/api/webhook$
    service: https://argocd-server.argocd.svc.cluster.local:443
    origin_request:
      no_tls_verify: true
  - hostname: argocd.tloi.vn
    service: https://argocd-server.argocd.svc.cluster.local:443
    origin_request:
      no_tls_verify: true

  - hostname: atlantis-hook.tloi.vn
    path: ^/events$
    service: http://atlantis.platform.svc.cluster.local:80
  - hostname: atlantis.tloi.vn
    service: http://atlantis.platform.svc.cluster.local:80

  - hostname: oj.tloi.vn
    path: ^/event/
    service: http://event.online-judge.svc.cluster.local:15100
  - hostname: oj.tloi.vn
    path: ^/channels/
    service: http://event.online-judge.svc.cluster.local:15102
  - hostname: oj.tloi.vn
    path: ^/(martor|pdf|submission_file|static-upload)/
    service: http://media.online-judge.svc.cluster.local:8080
  - hostname: oj.tloi.vn
    service: http://site.online-judge.svc.cluster.local:8000

  - hostname: sqllab.tloi.vn
    service: http://sqllab.platform.svc.cluster.local:3000

  - hostname: send.tloi.vn
    service: http://newsletter.platform.svc.cluster.local:9000

  - hostname: link.tloi.vn
    path: ^/rest/
    service: http_status:404
  - hostname: link.tloi.vn
    service: http://url-shortener.platform.svc.cluster.local:8080
  - hostname: link-admin.tloi.vn
    path: ^/rest/
    service: http://url-shortener.platform.svc.cluster.local:8080
  - hostname: link-admin.tloi.vn
    service: http://url-shortener-admin.platform.svc.cluster.local:8080

  - hostname: monitor.tloi.vn
    path: ^/-/(quit|reload)$
    service: http_status:404
  - hostname: monitor.tloi.vn
    service: http://prometheus.monitoring.svc.cluster.local:9090
  - hostname: alert.tloi.vn
    path: ^/-/(quit|reload)$
    service: http_status:404
  - hostname: alert.tloi.vn
    service: http://alertmanager.monitoring.svc.cluster.local:9093
